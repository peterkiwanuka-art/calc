
<!DOCTYPE html>
<html>
<head>
 <title>Simple Calculator</title>


<style>
body {
 background-color: #111;
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
 font-family: Arial;
 }
 .calculator {
 background-color: #222;
 padding: 20px;
 border-radius: 25px;
 width: 320px;
 }
 .display {
 background-color: #555;
 color: white;
 height: 80px;
 border-radius: 15px;
 margin-bottom: 20px;
 text-align: right;
 font-size: 40px;
 padding: 10px;
 }
 .buttons {
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 12px;
 }
 button {
 height: 65px;
 border: none;
 border-radius: 50%;
 font-size: 22px;
 background-color: #9da9b8;
 color: white;
 }
 .operator {
 background-color: #f0d000;
 }
 .zero {
 grid-column: span 2;
 border-radius: 40px;
 }
 .clear {
 color: black;
 }
 </style></head>

<body>
 <div class="calculator">
 <div class="display">
 0
 </div>
 <div class="buttons">
 <button class="clear">AC</button>
 <button>00</button>
 <button>%</button>
 <button class="operator">÷</button>
 <button>7</button>
 <button>8</button>
 <button>9</button>
 <button class="operator">×</button>
 <button>4</button>
 <button>5</button>
 <button>6</button>
 <button class="operator">−</button>
 <button>1</button>
 <button>2</button>
 <button>3</button>
 <button class="operator">+</button>
 <button class="zero">0</button>
 <button>.</button>
 <button class="operator">=</button>
 </div>
 </div>
</body>
</html>
